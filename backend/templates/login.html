<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    margin:0;
    font-family:"Segoe UI", Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4a6cf7,#7f53ff);
}

.login-card{
    width:330px;
    padding:35px 35px;
    padding-left: 10px;
    border-radius:18px;
    background:rgba(255,255,255,0.92);
    box-shadow:0 25px 50px rgba(0,0,0,0.25);
    text-align:center;
    animation:pop 0.5s ease;
}

@keyframes pop{
    from{transform:scale(0.9);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

.logo{
    width:70px;
    height:70px;
    background:#4a6cf7;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    color:white;
    margin:0 auto 15px;
}

h2{
    margin:0;
    font-size:22px;
    color:#333;
}

p{
    font-size:13px;
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#4a6cf7;
}

button{
    display:block;
    margin:18px auto 0 auto;

    width:85%;
    padding:14px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#4a6cf7,#7f53ff);
    color:white;

    font-size:15px;
    font-weight:600;
    letter-spacing:0.4px;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(74,108,247,0.35),
        inset 0 1px 0 rgba(255,255,255,0.3);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}



button:hover{
    background:#3b5bdb;
}

.footer{
    margin-top:18px;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="login-card">
    <div class="logo">💬</div>
    <h2>Welcome Back</h2>
    <p>Enter your username to start chatting</p>

    <form method="post">
        {% csrf_token %}
        <input name="username" placeholder="Username" required>
        <button type="submit">Login</button>
    </form>

    <div class="footer">
        Simple • Fast • Secure Chat
    </div>
</div>

</body>
</html>
