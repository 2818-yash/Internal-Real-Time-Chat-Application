<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select User</title>

<style>
body{
    margin:0;
    font-family: "Segoe UI", Arial;
    background: linear-gradient(135deg,#4a6cf7,#7f53ff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:360px;
    height:560px;
    background:#ffffff;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    overflow:hidden;
}

.header{
    padding:18px;
    background:#4a6cf7;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h3{
    margin:0;
    font-size:18px;
}

.logout{
    color:white;
    text-decoration:none;
    font-size:13px;
    background:rgba(255,255,255,.2);
    padding:6px 12px;
    border-radius:20px;
}

.users{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.user{
    display:flex;
    align-items:center;
    background:#f4f6f8;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    text-decoration:none;
    color:#000;
    transition:0.2s;
}

.user:hover{
    background:#e9edff;
    transform:scale(1.02);
}

.avatar{
    width:42px;
    height:42px;
    background:#4a6cf7;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    margin-right:12px;
}

.name{
    font-size:15px;
    font-weight:600;
}

.footer{
    padding:12px;
    text-align:center;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h3>Hello, {{ me }}</h3>
        <a class="logout" href="/logout/">Logout</a>
    </div>

    <div class="users">
        {% for user in users %}
            <a class="user" href="/chat/?user={{ user.username }}">
                <div class="avatar">
                    {{ user.username|first|upper }}
                </div>
                <div class="name">
                    {{ user.username }}
                </div>
            </a>
        {% endfor %}
    </div>

    <div class="footer">
        Select a contact to start chatting
    </div>

</div>

</body>
</html>
